<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click Count Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="start-screen">
        <div id="grid-background"></div>
        <div class="start-content">
            <h1 class="game-title">CLICK-O-WIN</h1>
            <button id="play-btn">PLAY NOW</button>
        </div>
    </div>

    <div class="game-info">
        <h2 class="level">Level: <span id="level-count">1</span></h2>
        <div class="progress-container">
            <div class="progress-bar" id="score-bar"></div>
        </div>
        <h2 class="heading">Score: <span class="count">0</span>/<span id="target-score">5</span></h2>
    </div>

    <div class="box">
        <div class="box1" id="target" title="Click me!"></div>
    </div>

    <!-- Popups -->
    <div id="popup-overlay" class="hidden">
        <!-- Game Over -->
        <div id="game-over-popup" class="popup hidden">
            <h2>Game Over!</h2>
            <p>You hit a bomb!</p>
            <button onclick="restartGame()">Try Again</button>
        </div>

        <!-- Level Up -->
        <div id="level-up-popup" class="popup hidden">
            <h2>Level Complete!</h2>
            <p>Ready for Level <span id="next-level-display">2</span>?</p>
            <button onclick="nextLevel()">Next Level</button>
        </div>

        <!-- Win (Replaced by Mystery Box Logic in JS, but keeping structure just in case) -->
        <div id="win-popup" class="popup hidden">
            <h2>You Won!</h2>
            <p>All levels completed!</p>
            <button onclick="restartGame()">Play Again</button>
        </div>

        <!-- Mystery Box Reward -->
        <div id="mystery-box-popup" class="popup hidden">
            <h2>Congratulation!</h2>
            <p>You have unlocked a Legendary Prize!</p>
            <div id="mystery-box" class="mystery-box-anim">🎁</div>
            <p style="font-size: 0.8rem; margin-top: 10px;">Click to Open</p>
        </div>

        <!-- Video Reward -->
        <div id="video-popup" class="popup hidden" style="background: black; padding: 10px;">
            <iframe id="rickroll-frame" width="100%" height="315" src="" title="YouTube video player" frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen></iframe>
            <button onclick="restartGame()" style="margin-top: 10px;">Close & Restart</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
